<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bunny Measure Auto</title><style>body{font-family:-apple-system;margin:18px;background:#f6f6f7}button,input{font-size:18px;padding:12px;margin:6px 0}canvas{max-width:100%;background:white;border-radius:12px}.card{background:white;padding:14px;border-radius:14px;margin:10px 0}b{font-size:20px}</style></head><body><h2>🐰 Bunny Measure AUTO v0.3</h2><div class=card>1. Chụp/upload ảnh 3:4 hoặc square có toàn bộ khung tape 40×40.<br>2. Bấm <b>Auto measure</b>. Không cần chấm điểm.</div><input id=f type=file accept="image/*" capture="environment"><br><button id=go>✨ Auto measure</button><div id=out class=card>Waiting for photo…</div><canvas id=c></canvas><script>
const f=document.getElementById('f'),go=document.getElementById('go'),out=document.getElementById('out'),cv=document.getElementById('c'); let img=new Image(),ctx=cv.getContext('2d'),loaded=false;
f.addEventListener('change',e=>{const file=e.target.files&&e.target.files[0]; if(!file)return; out.textContent='Loading photo…'; const r=new FileReader(); r.onload=()=>{img.onload=()=>{let sc=Math.min(1,1600/img.naturalWidth);cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);ctx.drawImage(img,0,0,cv.width,cv.height);loaded=true;out.innerHTML='Photo loaded. Tap <b>Auto measure</b>.'}; img.onerror=()=>out.textContent='Could not open this image. Try JPG/PNG.'; img.src=r.result}; r.onerror=()=>out.textContent='Could not read this image.'; r.readAsDataURL(file)}, false);
function lum(d,i){return .2126*d[i]+.7152*d[i+1]+.0722*d[i+2]}
function quant(a,p){a.sort((x,y)=>x-y);return a[Math.floor((a.length-1)*p)]}
go.addEventListener('click',()=>{if(!loaded)return alert('Choose a photo first');let W=cv.width,H=cv.height,im=ctx.getImageData(0,0,W,H),d=im.data;
// detect dark tape by row/column dark-pixel density, ignoring outer 3%
let ys=[],xs=[];for(let y=Math.floor(H*.03);y<H*.97;y+=2){let n=0;for(let x=Math.floor(W*.05);x<W*.95;x+=3)if(lum(d,(y*W+x)*4)<80)n++;ys.push([n,y])}for(let x=Math.floor(W*.03);x<W*.97;x+=2){let n=0;for(let y=Math.floor(H*.05);y<H*.95;y+=3)if(lum(d,(y*W+x)*4)<80)n++;xs.push([n,x])}
function peaks(a,axisLen){a.sort((a,b)=>b[0]-a[0]);let p=[];for(let q of a){if(p.every(v=>Math.abs(v-q[1])>axisLen*.15))p.push(q[1]);if(p.length==2)break}return p.sort((a,b)=>a-b)}
let py=peaks(ys,H),px=peaks(xs,W);if(px.length<2||py.length<2){out.innerHTML='❌ I could not see all four tape edges. Try a brighter photo with the whole 40×40 square visible.';return}let [L,R]=px,[T,B]=py;let sx=(R-L)/40,sy=(B-T)/40;
// garment segmentation: floor sampled just inside square corners; garment = pixels sufficiently different from median floor RGB and not very dark tape
let samples=[ [L+(R-L)*.1,T+(B-T)*.1],[R-(R-L)*.1,T+(B-T)*.1],[L+(R-L)*.1,B-(B-T)*.1],[R-(R-L)*.1,B-(B-T)*.1] ];let bg=[0,1,2].map(k=>samples.reduce((s,p)=>s+d[(Math.round(p[1])*W+Math.round(p[0]))*4+k],0)/samples.length);
let pts=[];for(let y=Math.max(0,T-0.35*(B-T));y<Math.min(H,B+0.35*(B-T));y+=2)for(let x=Math.max(0,L-0.15*(R-L));x<Math.min(W,R+0.15*(R-L));x+=2){let i=(y*W+x)*4,dr=Math.hypot(d[i]-bg[0],d[i+1]-bg[1],d[i+2]-bg[2]);let ll=lum(d,i);let onTape=(Math.abs(x-L)<10||Math.abs(x-R)<10||Math.abs(y-T)<10||Math.abs(y-B)<10);if(dr>48&&ll>45&&!onTape)pts.push([x,y])}
if(pts.length<100){out.innerHTML='⚠️ Square found, but garment detection failed. Try more light/contrast.';return}let xv=pts.map(p=>p[0]),yv=pts.map(p=>p[1]),gx1=quant(xv,.01),gx2=quant(xv,.99),gy1=quant(yv,.01),gy2=quant(yv,.99);let length=(gy2-gy1)/sy;
// waist: width of segmented garment around 43-55% down garment, choose minimum robust width
let widths=[];for(let yy=gy1+(gy2-gy1)*.38;yy<gy1+(gy2-gy1)*.58;yy+=4){let row=pts.filter(p=>Math.abs(p[1]-yy)<3).map(p=>p[0]);if(row.length>8){let w=(quant(row,.96)-quant(row,.04))/sx;if(w>4)widths.push(w)}}let waist=widths.length?quant(widths,.25):NaN;
ctx.drawImage(img,0,0,W,H);ctx.lineWidth=5;ctx.strokeStyle='#ff2d55';ctx.strokeRect(L,T,R-L,B-T);ctx.strokeStyle='#007aff';ctx.strokeRect(gx1,gy1,gx2-gx1,gy2-gy1);out.innerHTML=`✅ <b>Auto detected</b><br>40×40 frame: ${((R-L)/sx).toFixed(0)}″ × ${((B-T)/sy).toFixed(0)}″<br><b>Total length: ${length.toFixed(1)}″</b>${isNaN(waist)?'':`<br><b>Waist flat (estimate): ${waist.toFixed(1)}″</b>`}<br><small>Blue box = garment detected. This is the first automatic prototype; compare with your tape measurement.</small>`}, false);
</script></body></html>
